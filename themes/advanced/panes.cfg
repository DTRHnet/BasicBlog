# Advanced Theme Layout
# Demonstrates docking, fixed heights, and complex grid

# Top Navigation Bar (Fixed 8vh)
|nav 100 8 dock:top|

# Hero Section (Fixed 30vh) below nav
|hero 100 30 dock:top|

# Left Sidebar (Fixed width, full remaining height)
|left-panel 20 dock:left|

# Right Sidebar (Fixed width, full remaining height)
|right-panel 20 dock:right|

# Main Content Area (Automatically fills center)
|main-content|

# Bottom Status/Info Bar
|status-bar 100 5 dock:bottom|
