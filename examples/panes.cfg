# BasicBlog Panes Configuration
# Format: |pane_name [width%] [height%] [dock:position]|
# Each line represents a row of panes

# Header row - full width, 15% height
|header 100 15|

# Main content row - three columns with auto height
|sidebar 25|main 50|footer 25|

# Bottom navigation - full width, docked to bottom
|bottom-nav 100 dock:bottom|
